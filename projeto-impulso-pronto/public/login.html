<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impulso - Mensagens que movem seu negócio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            impulso: {
              DEFAULT: '#059669',
              dark: '#047857',
              darker: '#065F46',
              mint: '#D1FAE5',
              mintLight: '#ECFDF5',
              graphite: '#111827',
              bg: '#F8FAFC'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased">
  
  <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-3xl p-8 shadow-xl shadow-slate-200/50 space-y-6 relative overflow-hidden">
    <!-- Decoração suave de fundo -->
    <div class="absolute -top-20 -right-20 w-44 h-44 bg-emerald-100/60 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -left-20 w-44 h-44 bg-emerald-50 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header Logo Impulso -->
    <div class="text-center space-y-2 relative">
      <div class="flex items-center justify-center space-x-2.5">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-10 h-10">
          <path d="M7.5 22.8C7.1 21.9 7.3 20.8 8.1 20.1L15.6 13.8C16.6 12.9 18.2 13.2 18.8 14.4L20.2 17.3C20.6 18.2 20.4 19.3 19.6 20L12.1 26.3C11.1 27.2 9.5 26.9 8.9 25.7L7.5 22.8Z" fill="#059669"/>
          <path d="M16 13.8C15.6 12.9 15.8 11.8 16.6 11.1L24.1 4.8C25.1 3.9 26.7 4.2 27.3 5.4L28.7 8.3C29.1 9.2 28.9 10.3 28.1 11L20.6 17.3C19.6 18.2 18 17.9 17.4 16.7L16 13.8Z" fill="#059669"/>
        </svg>
        <span class="text-3xl font-extrabold tracking-tight text-[#111827]">impulso</span>
      </div>
      <p class="text-xs text-slate-500 font-medium">Mensagens que movem seu negócio.</p>
    </div>

    <!-- Feedback de Erro -->
    <div id="login-error" class="hidden p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center space-x-2">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-rose-600"></i>
      <span id="login-error-msg">E-mail ou senha incorretos.</span>
    </div>

    <!-- Form de Login -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 relative">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Seu E-mail:</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          <input type="email" id="email" required placeholder="seuemail@empresa.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pl-10 pr-4 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#059669] focus:border-transparent transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Sua Senha:</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pl-10 pr-4 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#059669] focus:border-transparent transition">
        </div>
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-[#059669] hover:bg-[#047857] text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-emerald-200 transition flex items-center justify-center space-x-2 text-sm">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Entrar na Plataforma</span>
      </button>
    </form>

    <!-- Botões Rápidos de Acesso para Demonstração/Teste -->
    <div class="pt-4 border-t border-slate-100 space-y-2">
      <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider text-center">Acessos Rápidos de Demonstração:</p>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="fillQuickCredentials('admin@disparozap.com', 'admin123')" class="text-[11px] font-semibold bg-slate-50 hover:bg-slate-100 text-slate-700 py-2 px-2.5 rounded-xl border border-slate-200 flex items-center justify-center space-x-1.5 transition">
          <i data-lucide="shield" class="w-3.5 h-3.5 text-[#059669]"></i>
          <span>Super Admin</span>
        </button>
        <button type="button" onclick="fillQuickCredentials('cliente@empresa.com', 'cliente123')" class="text-[11px] font-semibold bg-slate-50 hover:bg-slate-100 text-slate-700 py-2 px-2.5 rounded-xl border border-slate-200 flex items-center justify-center space-x-1.5 transition">
          <i data-lucide="building-2" class="w-3.5 h-3.5 text-[#059669]"></i>
          <span>Empresa Cliente</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    if (window.lucide) lucide.createIcons();

    function fillQuickCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-submit');
      const errBox = document.getElementById('login-error');
      const errMsg = document.getElementById('login-error-msg');

      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i><span>Entrando...</span>';
      if (window.lucide) lucide.createIcons();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Credenciais inválidas');
        }

        // Armazena Token e Perfil
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', JSON.stringify(data.user));

        if (data.user.role === 'SUPERADMIN') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/index.html';
        }
      } catch (err) {
        errMsg.textContent = err.message;
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i><span>Entrar na Plataforma</span>';
        if (window.lucide) lucide.createIcons();
      }
    }
  </script>
</body>
</html>
